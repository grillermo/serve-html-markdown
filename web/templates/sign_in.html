{{define "title"}}Sign in{{end}}

{{define "content"}}<main class="signin">
  <h1>Sign in</h1>

  {{if .Alert}}
    <p class="signin-alert">{{.Alert}}</p>
  {{end}}

  <form class="new_user" id="new_user" action="/users/sign_in" accept-charset="UTF-8" method="post">
    {{if .ReturnTo}}<input type="hidden" name="return_to" value="{{.ReturnTo}}">{{end}}
    <div class="field">
      <label for="user_email">Email</label>
      <input autofocus="autofocus" autocomplete="email" required="required" type="email"{{if .Email}} value="{{.Email}}"{{end}} name="user[email]" id="user_email">
    </div>

    <div class="field">
      <label for="user_password">Password</label>
      <input autocomplete="current-password" required="required" type="password" name="user[password]" id="user_password">
    </div>

    <div class="field field--checkbox">
      <input name="user[remember_me]" type="hidden" value="0" autocomplete="off"><input type="checkbox" value="1" name="user[remember_me]" id="user_remember_me">
      <label for="user_remember_me">Remember me</label>
    </div>

    <input type="submit" name="commit" value="Sign in">
  </form>
</main>
{{end}}

{{template "layout" .}}
